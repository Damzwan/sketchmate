apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android' // <-- MOVED THIS TO THE TOP!

android {
    namespace "ninja.sketchmate.app"
    compileSdk rootProject.ext.compileSdkVersion

    kotlinOptions {
        jvmTarget = '21'
    }

    buildFeatures {
        viewBinding true
    }

    defaultConfig {
        applicationId "ninja.sketchmate.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 141
        versionName "0.4.4"
        // The web UI and Android resources currently ship in English only.
        // Do not package translations contributed by native dependencies that
        // the app can never select.
        resourceConfigurations += ['en']
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            // Clears the Play vitals "app is not optimized" warning and cuts
            // APK size / cold start. Does NOT touch the WebView, so it does not
            // affect the draw-engine ANRs (docs/DRAW_ENGINE_PERF.md, F1ch0).
            //
            // Capacitor discovers plugins reflectively — see proguard-rules.pro.
            // SMOKE-TEST A RELEASE BUILD before shipping: push notifications,
            // camera, keyboard, Firebase auth (Google + phone), share, and the
            // home-screen widget. Reflection breakage only shows up here.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// RevenueCat documents Amazon IAP as an optional store dependency. This app is
// distributed through Google Play and never configures `useAmazon`, so exclude
// the Amazon SDK pulled in by Hybrid Common from every app configuration.
configurations.configureEach {
    exclude group: 'com.revenuecat.purchases', module: 'purchases-store-amazon'
    exclude group: 'com.amazon.device', module: 'amazon-appstore-sdk'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation project(':capacitor-android')
    implementation 'com.google.firebase:firebase-messaging:23.2.1'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'com.google.code.gson:gson:2.8.9'
    // Bounded decode, memory/disk cache and bitmap pooling for notifications
    // and the home-screen widget. No annotation processor is needed because we
    // do not use a generated Glide API or custom module.
    implementation 'com.github.bumptech.glide:glide:5.0.7'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
